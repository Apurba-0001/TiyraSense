name: TiyraSense Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & ML Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend & ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt

      - name: Run pytest test suite
        env:
          APP_ENV: test
          DATA_LABEL: TEST
          AUTH_SECRET_KEY: test_secret_key_at_least_32_characters_long_for_ci
        run: |
          python -m pytest backend/tests tests/test_e2e_demo_scenario.py -v

  web-tests:
    name: Web Dashboard Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run Vitest tests
        working-directory: web
        run: npm test -- --run

      - name: Build web application
        working-directory: web
        run: npm run build

  mobile-tests:
    name: Mobile App Flutter Tests & Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify static analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter widget test suite
        working-directory: mobile
        run: flutter test
