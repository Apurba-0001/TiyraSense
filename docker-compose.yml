services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tiyrasense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiyrasense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiyrasense_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tiyrasense_db}
    ports:
      - "5432:5432"
    volumes:
      - tiyrasense_pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tiyrasense_user} -d ${POSTGRES_DB:-tiyrasense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tiyrasense-net

volumes:
  tiyrasense_pgdata:

networks:
  tiyrasense-net:
    driver: bridge
